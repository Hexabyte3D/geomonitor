<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms and video embeds</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section class="navbar">
        <div class="logo_container">
            <img class="logo" src="./img/logo6@0.5x.png" alt="Logo Geomonitor">
        </div>
        <div class="nav_container">
            <nav>
                <button type="button" class="nav-button"><a href="./index.html">Home</a></button>
                <button type="button" class="nav-button"><a href="./html/S_earthquakes.html">Earthquakes</a></button>
                <button type="button" class="nav-button"><a href="./html/s_volcanoes.html">Volcanoes</a></button>
                <button type="button" class="nav-button"><a href="./html/s_predictions.html">Predictions</a></button>
                <button type="button" class="nav-button"><a href="./html/about_geomonitor.html">About
                        Geomonitor</a></button>
            </nav>
        </div>
        <div class="seismo_animated_container">
            <img class="animated_seismo" src="./img/seismogram3.jpg" alt="seismogram animated - grok" class="nav-image">
        </div>
    </section>
    <section id="home">
        <main class="container">
            <div class="Form_Container home-column-1">
                <Form class="Beta_Form">
                    <br>
                    <h2>Become a Beta Tester</h2>

                    <p>Beta testers will get first access to the app download and a 50% discount to the monthly
                        subscription after the official launch.</p>
                    <p>No initial costs. Beta software collects data on performance and prompts users for feedback.</p>
                    <br>

                    <label for="Name_first">First Name: </label>
                    <input type="text" placeholder="first">
                    <label for="Name_last"> Last Name:</label>
                    <input type="text" placeholder="last">
                    <br>
                    <br>
                    <label for="Email">Email: </label>
                    <input type="email" id="Email" placeholder="user@email.com">
                    <br>
                    <br>
                    <label for="Age">Birthday: </label>
                    <input type="date">
                    <br>
                    <br>
                    <label for="Phone">Text Updates</label>
                    <input type="tel" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required placeholder="###-###-####" name="phone_number" id="Phone">
                    <br>
                    <br>
                    <input type="submit" title="Apply" class="Apply">
                </Form>

            </div>
            <div class="video-container">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/SkfR4GBEIp8?si=wrDn_QuRe5rjn6MQ"
                    title="How to read a seismogram: USGS"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
            </div>
        </main>
    </section>
</body>

</html>
